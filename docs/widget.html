<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Virtuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .chat-window-transition {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .message-animation {
            animation: messageAppear 0.3s cubic-bezier(0, 0, 0.2, 1);
        }
        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        /* Mode intégré (dans l'iframe de la page démo) : la fenêtre de chat
           remplit l'iframe et le lanceur interne est masqué — un seul
           bouton rond, celui de la page parente. */
        html.embedded, html.embedded body { height: 100%; }
        html.embedded body { position: relative; }
        html.embedded #chat-launcher { display: none !important; }
        html.embedded #chat-window {
            position: absolute !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: auto !important; height: auto !important;
            opacity: 1 !important; pointer-events: auto !important;
            transform: none !important; border-radius: 0 !important;
        }
    </style>
</head>
<body class="bg-transparent">

    <!-- Launcher -->
    <div id="chat-launcher" class="fixed bottom-6 right-6 w-14 h-14 bg-black text-white rounded-full shadow-2xl cursor-pointer flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 z-[10000]">
        <svg id="launcher-icon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 1.657-1.343 3-3 3h-6c-1.657 0-3-1.343-3-3s1.343-3 3-3h6c1.657 0 3 1.343 3 3z" />
        </svg>
    </div>

    <!-- Chat Window -->
    <div id="chat-window" class="fixed bottom-24 right-6 w-[380px] h-[600px] glass rounded-[32px] shadow-[0_20px_50px_rgba(0,0,0,0.1)] flex flex-col overflow-hidden z-[9999] chat-window-transition opacity-0 pointer-events-none translate-y-10 scale-95">

        <!-- Header -->
        <div id="chat-header" class="px-6 py-5 flex items-center justify-between border-b border-gray-200/50 transition-colors duration-500">
            <div class="flex items-center gap-3">
                <div id="chat-avatar" class="w-10 h-10 bg-gray-100 text-black rounded-2xl flex items-center justify-center font-semibold text-sm border border-gray-200">??</div>
                <div class="overflow-hidden">
                    <h3 id="chat-header-name" class="text-sm font-semibold text-gray-900 truncate leading-tight">Le Comptoir de Jules</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-[11px] text-gray-500 font-medium">En ligne</span><span class="ml-2 px-1.5 py-0.5 bg-amber-400 text-black text-[10px] font-bold rounded-full">DÉMO</span>
                    </div>
                </div>
            </div>
            <button id="close-chat" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
            <!-- Messages injected here -->
        </div>

        <!-- Reservation Form -->
        <div id="reservation-form" class="hidden p-6 bg-white border-t border-gray-100 space-y-4 message-animation">
            <h4 class="text-sm font-semibold text-gray-900 mb-3">Réserver une table/rendez-vous</h4>
            <div class="grid grid-cols-1 gap-3">
                <input type="text" id="res-name" placeholder="Votre nom complet" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                <input type="email" id="res-email" placeholder="Votre adresse email" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                <div class="flex gap-2">
                    <input type="date" id="res-date" class="flex-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                    <input type="time" id="res-time" class="flex-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                </div>
                <input type="number" id="res-guests" placeholder="Nombre de personnes" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                <input type="tel" id="res-phone" placeholder="Votre téléphone" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-black/5">
                <button id="confirm-res" class="w-full py-2 bg-black text-white rounded-xl text-xs font-semibold hover:bg-gray-800 transition-all">Confirmer la réservation</button>
                <button id="cancel-res" class="w-full py-2 text-gray-400 text-xs font-medium hover:text-gray-600 transition-all">Annuler</button>
            </div>
        </div>

        <!-- Input Area -->
        <div id="chat-input-container" class="p-6 pt-2">
            <div class="relative flex items-center gap-2">
                <input type="text" id="chat-input" placeholder="Écrivez votre message..."
                    class="w-full pl-4 pr-12 py-3 bg-gray-100 border-none rounded-2xl text-sm text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-black/5 transition-all outline-none">
                <button id="send-btn" class="absolute right-2 p-2 bg-black text-white rounded-xl hover:bg-gray-800 transition-all active:scale-90">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            <div class="text-center mt-3">
                <span class="text-[10px] text-gray-400 font-medium uppercase tracking-widest">Démo — réponses simulées</span>
            </div>
        </div>

    <script>
(function () {
    // Mode intégré : cette page tourne dans l'iframe de la page démo.
    // La fenêtre de chat remplit alors l'iframe et le lanceur interne
    // est masqué (le bouton rond de la page parente fait office de lanceur).
    var EMBEDDED = window.self !== window.top;
    if (EMBEDDED) {
        document.documentElement.classList.add('embedded');
    }

    var DEMO_CONFIG = {
        nom: 'Le Comptoir de Jules',
        initials: 'CJ',
        welcomeMsg: "Bonjour ! Bienvenue au Comptoir de Jules. Je suis la démo du chatbot : posez-moi une question sur nos horaires, la carte, une réservation ou notre adresse.",
        suggestions: ["Quels sont vos horaires ?", "Je veux réserver une table", "Voir la carte", "Où êtes-vous situés ?"]
    };

    var session = {
        id: sessionStorage.getItem('chat_session_id') || ('sess_' + Date.now()),
        isOpen: EMBEDDED,
        isLoading: false,
        history: []
    };
    sessionStorage.setItem('chat_session_id', session.id);

    var dom = {
        launcher: document.getElementById('chat-launcher'),
        window: document.getElementById('chat-window'),
        messages: document.getElementById('chat-messages'),
        input: document.getElementById('chat-input'),
        send: document.getElementById('send-btn'),
        close: document.getElementById('close-chat'),
        headerName: document.getElementById('chat-header-name'),
        avatar: document.getElementById('chat-avatar'),
        header: document.getElementById('chat-header'),
        resForm: document.getElementById('reservation-form'),
        inputContainer: document.getElementById('chat-input-container'),
        confirmRes: document.getElementById('confirm-res'),
        cancelRes: document.getElementById('cancel-res')
    };

    // Détecte une date / heure déjà donnée par l'utilisateur
    // (ex. « demain 14h », « vendredi 10h30 ») pour l'accuser au lieu de redemander.
    function extractWhen(text) {
        var low = text.toLowerCase();
        var day = null, dateVal = null;
        var today = new Date();
        function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        if (/demain/.test(low)) {
            var t = new Date(today); t.setDate(t.getDate() + 1);
            day = 'demain'; dateVal = iso(t);
        } else if (/aujourd'hui|aujourd’hui|ce jour/.test(low)) {
            day = "aujourd'hui"; dateVal = iso(today);
        } else {
            var days = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
            for (var i = 0; i < days.length; i++) {
                if (low.indexOf(days[i]) !== -1) {
                    var target = (i + 7 - today.getDay()) % 7 || 7;
                    var d = new Date(today); d.setDate(d.getDate() + target);
                    day = days[i]; dateVal = iso(d);
                    break;
                }
            }
        }
        var hm = low.match(/(\d{1,2})\s*h\s*(\d{2})?|(\d{1,2}):(\d{2})/);
        var timeVal = null, timeLabel = null;
        if (hm) {
            var h = String(parseInt(hm[1] || hm[3], 10)).padStart(2, '0');
            var m = String(parseInt(hm[2] || hm[4] || '00', 10)).padStart(2, '0');
            timeVal = h + ':' + m;
            timeLabel = (m === '00' ? h.replace(/^0/, '') + 'h' : h.replace(/^0/, '') + 'h' + m);
        }
        if (!day && !timeVal) return null;
        return { label: [day, timeLabel].filter(Boolean).join(' à '), date: dateVal, time: timeVal };
    }
    var lastWhen = null;

    function demoReply(text) {
        var low = text.toLowerCase();
        if (/(bonjour|salut|coucou|hello|bonsoir)/.test(low)) return "Bonjour ! Ravie de vous accueillir au Comptoir de Jules. Je peux vous renseigner sur nos horaires, la carte, les réservations ou notre adresse. Que souhaitez-vous savoir ?";
        if (/(r[eé]serv|table|rendez-vous|rdv)/.test(low)) {
            lastWhen = extractWhen(text);
            if (lastWhen) return "Parfait, " + lastWhen.label + " — c'est noté pour votre réservation. Je vous ouvre le formulaire pour confirmer avec vos coordonnées.";
            return "Bien sûr ! Je vous ouvre le formulaire de réservation — indiquez votre nom, votre e-mail, la date et l'heure, et c'est noté.";
        }
        if (/(horaire|ouvert|ferm|heure)/.test(low)) return "Nous sommes ouverts du mardi au dimanche, de 11h30 à 14h30 et de 18h30 à 22h30. Fermé le lundi. La cuisine ferme 30 minutes avant la fermeture.";
        if (/(prix|tarif|menu|carte|plat|manger|formule)/.test(low)) return "Notre carte : formule déjeuner 16 €, plat du jour 14 €, menu du soir 29 € (entrée + plat + dessert). Notre spécialité : le poulet rôti aux herbes et son jus. Voulez-vous réserver une table ?";
        if (/(adresse|o[uù]|situ[eé]|venir|parking|acc[eè]s|itin[eé]raire|plan)/.test(low)) return "Nous sommes au 12 rue des Lilas, 77420 Champs-sur-Marne. Parking gratuit devant le restaurant, RER A (Noisy-Champs) à 5 minutes à pied.";
        if (/(t[eé]l[eé]phone|contact|appeler|joindre|num[eé]ro)/.test(low)) return "Vous pouvez nous joindre au 01 84 12 34 56 (numéro fictif — ceci est une démonstration).";
        if (/(livraison|emporter|takeaway)/.test(low)) return "Nous proposons la vente à emporter : commandez par téléphone et récupérez votre commande au comptoir. Pas de livraison pour le moment.";
        if (/(v[eé]g[eé]tarien|vegan|allergie|sans gluten)/.test(low)) return "Nous avons des options végétariennes chaque jour, et des plats sans gluten sur demande — précisez-le simplement dans votre réservation.";
        if (/merci/.test(low)) return "Avec plaisir ! Autre chose ?";
        if (/(au revoir|à bientôt|bye)/.test(low)) return "À bientôt au Comptoir de Jules !";
        return "Je suis une démo : je peux répondre aux questions sur les horaires, la carte, les réservations et l'adresse. Essayez par exemple « Quels sont vos horaires ? ».";
    }

    function addMessage(text, sender) {
        var wrapper = document.createElement('div');
        wrapper.className = 'flex ' + (sender === 'user' ? 'justify-end' : 'justify-start') + ' message-animation';
        var bubble = document.createElement('div');
        bubble.className = 'max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed ' + (sender === 'user'
            ? 'bg-black text-white rounded-tr-none shadow-md'
            : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none shadow-sm');
        bubble.innerText = text;
        wrapper.appendChild(bubble);
        dom.messages.appendChild(wrapper);
        scrollToBottom();
        session.history.push({ text: text, sender: sender });
        sessionStorage.setItem('chat_history', JSON.stringify(session.history.slice(-20)));
    }

    function scrollToBottom() {
        dom.messages.scrollTo({ top: dom.messages.scrollHeight, behavior: 'smooth' });
    }

    function showTypingIndicator() {
        var indicator = document.createElement('div');
        indicator.id = 'typing-indicator';
        indicator.className = 'flex justify-start message-animation';
        indicator.innerHTML = '<div class="bg-white border border-gray-200 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm flex gap-1">'
            + '<span class="w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce"></span>'
            + '<span class="w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce [animation-delay:0.2s]"></span>'
            + '<span class="w-1.5 h-1.5 bg-gray-300 rounded-full animate-bounce [animation-delay:0.4s]"></span>'
            + '</div>';
        dom.messages.appendChild(indicator);
        scrollToBottom();
        return indicator;
    }

    function sendMessage() {
        var text = dom.input.value.trim();
        if (!text || session.isLoading) return;
        dom.input.value = '';
        addMessage(text, 'user');
        session.isLoading = true;
        dom.input.disabled = true;
        showTypingIndicator();
        setTimeout(function () {
            var reply = demoReply(text);
            var ind = document.getElementById('typing-indicator');
            if (ind) ind.remove();
            addMessage(reply, 'bot');
            if (/r[eé]serv/.test(reply.toLowerCase())) {
                setTimeout(openReservationForm, 1000);
            }
            session.isLoading = false;
            dom.input.disabled = false;
            scrollToBottom();
        }, 700);
    }

    function openReservationForm() {
        // Pré-remplit la date / l'heure déjà données par l'utilisateur.
        if (lastWhen) {
            var d = document.getElementById('res-date'), t = document.getElementById('res-time');
            if (lastWhen.date && d) d.value = lastWhen.date;
            if (lastWhen.time && t) t.value = lastWhen.time;
        }
        dom.inputContainer.classList.add('hidden');
        dom.resForm.classList.remove('hidden');
    }

    function closeReservationForm() {
        dom.resForm.classList.add('hidden');
        dom.inputContainer.classList.remove('hidden');
    }

    function submitReservation() {
        var resData = {
            name: document.getElementById('res-name').value,
            email: document.getElementById('res-email').value,
            date: document.getElementById('res-date').value,
            time: document.getElementById('res-time').value,
            guests: document.getElementById('res-guests').value,
            phone: document.getElementById('res-phone').value
        };
        if (!resData.name || !resData.email || !resData.phone) {
            alert('SVP remplissez Nom, Email et Téléphone.');
            return;
        }
        closeReservationForm();
        addMessage("Merci " + resData.name + " ! Votre réservation (démo) est notée pour le " + (resData.date || 'date à préciser') + " à " + (resData.time || 'heure à préciser') + " (" + (resData.guests || '?') + " pers.). Aucun e-mail n'a été envoyé et vos données ne quittent pas cette page — c'est une simulation.", 'bot');
    }

    dom.launcher.onclick = function () {
        if (EMBEDDED) return; // en mode intégré, le lanceur de la page parente gère l'ouverture
        session.isOpen = !session.isOpen;
        dom.window.classList.toggle('opacity-0', !session.isOpen);
        dom.window.classList.toggle('pointer-events-none', !session.isOpen);
        dom.window.classList.toggle('translate-y-10', !session.isOpen);
        dom.window.classList.toggle('scale-95', !session.isOpen);
        if (session.isOpen) dom.input.focus();
    };

    dom.close.onclick = function (e) {
        e.stopPropagation();
        session.isOpen = false;
        if (EMBEDDED) {
            // Demande à la page parente de masquer l'iframe.
            window.parent.postMessage({ type: 'stacksbot-widget-close' }, '*');
            return;
        }
        dom.window.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10', 'scale-95');
    };

    dom.send.onclick = sendMessage;
    dom.input.onkeydown = function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    };
    dom.confirmRes.onclick = submitReservation;
    dom.cancelRes.onclick = closeReservationForm;

    // Questions envoyées par la page d'accueil de la démo (postMessage).
    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'demo-ask' && e.data.text) {
            if (!session.isOpen && !EMBEDDED) dom.launcher.click();
            dom.input.value = e.data.text;
            sendMessage();
        }
    });

    // Init locale, sans aucun appel réseau.
    dom.headerName.innerText = DEMO_CONFIG.nom;
    dom.avatar.innerText = DEMO_CONFIG.initials;
    addMessage(DEMO_CONFIG.welcomeMsg, 'bot');
    var suggDiv = document.createElement('div');
    suggDiv.className = 'flex flex-wrap gap-2 mb-6';
    DEMO_CONFIG.suggestions.forEach(function (text) {
        var chip = document.createElement('div');
        chip.className = 'px-3 py-1.5 bg-white border border-gray-200 text-gray-600 text-xs font-medium rounded-full cursor-pointer hover:border-black hover:text-black transition-all shadow-sm';
        chip.innerText = text;
        chip.onclick = function () { dom.input.value = text; sendMessage(); };
        suggDiv.appendChild(chip);
    });
    dom.messages.appendChild(suggDiv);
})();
</script>
</body>
</html>
