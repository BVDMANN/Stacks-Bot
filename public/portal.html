<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Client — Stacks-Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; }
        .apple-glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.05); }
        .input-apple { width: 100%; padding: 12px; background: #fff; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body class="min-h-screen p-6">
    <nav class="max-w-6xl mx-auto flex justify-between items-center py-6 mb-12">
        <div class="text-xl font-bold tracking-tight text-black">Stacks<span class="text-gray-400 font-medium">-Bot</span> <span class="ml-2 px-2 py-1 bg-black text-white text-[10px] rounded-md">CLIENT</span></div>
        <button onclick="logout()" class="text-sm font-medium text-gray-500 hover:text-black transition-colors">Déconnexion</button>
    </nav>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Control Panel -->
        <div class="lg:col-span-1 space-y-6">
            <div class="apple-glass p-8 rounded-[32px] shadow-sm">
                <h2 class="text-lg font-bold mb-6">⚙️ Configuration</h2>
                <form id="config-form" class="space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Nom de l'entreprise</label>
                        <input type="text" id="nom" class="input-apple mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Base de connaissances</label>
                        <textarea id="knowledgeBase" rows="5" class="input-apple mt-1 resize-none"></textarea>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Couleur Primaire</label>
                        <input type="color" id="color" class="w-full h-10 mt-1 rounded-lg cursor-pointer">
                    </div>
                    <button type="submit" class="w-full py-3 bg-black text-white rounded-xl font-semibold text-sm hover:bg-gray-800 transition-all">Mettre à jour mon Bot</button>
                </form>
            </div>

            <div class="apple-glass p-8 rounded-[32px] shadow-sm">
                <h2 class="text-lg font-bold mb-4">🚀 Installation</h2>
                <p class="text-xs text-gray-500 mb-4">Copiez ce code dans la section &lt;head&gt; de votre site :</p>
                <div class="bg-gray-900 p-4 rounded-xl overflow-x-auto">
                    <code id="embed-code" class="text-xs text-green-400 break-all">Chargement...</code>
                </div>
                <button onclick="copyCode()" class="w-full mt-4 py-2 border border-gray-200 rounded-xl text-xs font-medium hover:bg-gray-50 transition-all">Copier le code</button>
            </div>
        </div>

        <!-- Stats & Monitoring -->
        <div class="lg:col-span-2 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="apple-glass p-6 rounded-[32px] text-center">
                    <div class="text-gray-400 text-xs font-bold uppercase mb-2">Messages Totaux</div>
                    <div id="stat-total" class="text-3xl font-bold">0</div>
                </div>
                <div class="apple-glass p-6 rounded-[32px] text-center">
                    <div class="text-gray- la text-xs font-bold uppercase mb-2">Réservations</div>
                    <div id="stat-res" class="text-3xl font-bold">0</div>
                </div>
                <div class="apple-glass p-6 rounded-[32px] text-center">
                    <div class="text-gray-400 text-xs font-bold uppercase mb-2">Status</div>
                    <div class="text-green-500 text-sm font-bold flex items-center justify-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Actif
                    </div>
                </div>
            </div>

            <div class="apple-glass p-8 rounded-[32px] shadow-sm overflow-hidden">
                <h2 class="text-lg font-bold mb-6">💬 Dernières Conversations</h2>
                <div id="conv-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <!-- Conversations injected here -->
                    <p class="text-center text-gray-400 py-10 text-sm">Aucune conversation pour le moment.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('clientId') || localStorage.getItem('my_clientId');

        if (!clientId) {
            window.location.href = '/';
        } else {
            localStorage.setItem('my_clientId', clientId);
        }

        async function loadClientData() {
            const res = await fetch(`/config/public?clientId=${clientId}`);
            const config = await res.json();

            document.getElementById('nom').value = config.nom;
            document.getElementById('color').value = config.colors.primary;
            document.getElementById('embed-code').innerText = `<script src="https://yourdomain.com/embed/chatbot.js?id=${clientId}"><\/script>`;

            // Load knowledgeBase requires a private API (not implemented in public config)
            // For a real app, we'd have a /api/config/private endpoint
        }

        async function updateBot(e) {
            e.preventDefault();
            const updates = {
                nom: document.getElementById('nom').value,
                knowledgeBase: document.getElementById('knowledgeBase').value,
                colors: { primary: document.getElementById('color').value }
            };

            const res = await fetch('/api/setup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ clientId, updates })
            });

            if (res.ok) alert("Bot mis à jour avec succès !");
        }

        function copyCode() {
            const code = document.getElementById('embed-code').innerText;
            navigator.clipboard.writeText(code);
            alert("Code copié !");
        }

        function logout() {
            localStorage.removeItem('my_clientId');
            window.location.href = '/';
        }

        document.getElementById('config-form').onsubmit = updateBot;
        loadClientData();
    </script>
</body>
</html>
